<!DOCTYPE html>
<html lang="ca">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Font Radioactiva</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
  :root{--groc:#f7d000;--negre:#000;--text:#e8e8e8;--vermell:#e23a2e;--verd:#3ad06a;--panell:#141414;--vora:#2a2a2a;}
  html,body{height:100%;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    background:var(--negre);color:var(--text);overflow:hidden;
    display:flex;align-items:center;justify-content:center;text-align:center;user-select:none;
  }
  .screen{display:none;flex-direction:column;align-items:center;justify-content:center;
    width:100%;height:100%;padding:28px;position:absolute;inset:0;overflow-y:auto;}
  .screen.active{display:flex;}

  /* ---------- INTRO ---------- */
  #intro{justify-content:flex-start;padding-top:max(40px,env(safe-area-inset-top));}
  .trefoil{width:84px;height:84px;margin:6px 0 16px;filter:drop-shadow(0 0 18px rgba(247,208,0,.35));}
  h1{color:var(--groc);font-size:1.55rem;text-transform:uppercase;letter-spacing:1px;margin-bottom:12px;}
  p.lead{max-width:360px;line-height:1.6;font-size:.95rem;color:#bbb;margin-bottom:22px;}
  p.lead b{color:var(--text);}
  .opts{background:var(--panell);border:1px solid var(--vora);border-radius:14px;padding:18px;margin-bottom:22px;width:100%;max-width:360px;}
  .opts label.row{display:flex;justify-content:space-between;align-items:center;font-size:.9rem;margin-bottom:16px;gap:10px;}
  .opts label.row:last-of-type{margin-bottom:0;}
  .opts .control{display:flex;align-items:center;gap:10px;}
  .opts input[type=range]{width:120px;accent-color:var(--groc);}
  .opts .v{color:var(--groc);font-family:ui-monospace,monospace;min-width:54px;text-align:right;}
  .check{display:flex;align-items:center;gap:9px;justify-content:flex-start;font-size:.85rem;color:#aaa;margin-top:14px;}
  .check input{width:18px;height:18px;accent-color:var(--groc);flex-shrink:0;}
  button{
    background:var(--groc);color:#000;border:none;border-radius:12px;padding:16px 28px;
    font-size:1.05rem;font-weight:700;text-transform:uppercase;letter-spacing:1.5px;cursor:pointer;
    transition:transform .1s;width:100%;max-width:360px;
  }
  button:active{transform:scale(.97);}
  .err{color:var(--vermell);font-size:.85rem;margin-top:16px;max-width:340px;line-height:1.5;min-height:1em;}

  /* ---------- JOC (negre) ---------- */
  #play{background:#000;justify-content:center;}
  .hint{color:#2a2a2a;font-size:.9rem;letter-spacing:3px;text-transform:uppercase;}
  .pulse-ring{width:28px;height:28px;border-radius:50%;background:#1c1c1c;margin-top:26px;--tick:var(--groc);--tick-scale:2.4;--tick-glow:22px;}
  .pulse-ring.tick{animation:tick .12s ease-out;}
  @keyframes tick{0%{transform:scale(1);background:#1c1c1c;}40%{transform:scale(var(--tick-scale));background:var(--tick);box-shadow:0 0 var(--tick-glow) var(--tick);}100%{transform:scale(1);background:#1c1c1c;}}
  .exit-btn{position:absolute;top:max(16px,env(safe-area-inset-top));left:16px;width:auto;background:none;color:#3a3a3a;font-size:.8rem;font-weight:600;letter-spacing:1px;padding:8px 10px;}

  /* ---------- ALARMA ---------- */
  #alarm{background:#1a0000;}
  #alarm.flash{animation:redflash .4s infinite;}
  @keyframes redflash{0%,100%{background:#1a0000;}50%{background:#5a0000;}}
  .alarm-title{color:var(--vermell);font-size:1.7rem;font-weight:800;text-transform:uppercase;
    letter-spacing:2px;margin-bottom:8px;animation:blink 1s infinite;}
  .alarm-sub{color:#ff9b94;font-size:.9rem;margin-bottom:30px;}
  @keyframes blink{50%{opacity:.3;}}
  #defuse{background:var(--vermell);color:#fff;width:200px;height:200px;border-radius:50%;max-width:200px;
    font-size:1.1rem;box-shadow:0 0 40px rgba(226,58,46,.6);animation:dpulse 1s infinite;}
  @keyframes dpulse{0%,100%{box-shadow:0 0 0 0 rgba(226,58,46,.6);}50%{box-shadow:0 0 0 30px rgba(226,58,46,0);}}

  /* ---------- FINAL ---------- */
  #win{background:#001a06;}
  .win-title{color:var(--verd);font-size:1.9rem;font-weight:800;text-transform:uppercase;margin-bottom:14px;}
  .stat{color:#9fe;font-family:ui-monospace,monospace;font-size:.95rem;margin-bottom:6px;}
</style>
</head>
<body>

<!-- PANTALLA 1: INTRO -->
<div class="screen active" id="intro">
  <svg class="trefoil" viewBox="0 0 100 100">
    <circle cx="50" cy="50" r="48" fill="#f7d000"/>
    <g fill="#000">
      <circle cx="50" cy="50" r="9"/>
      <path d="M50 50 L72.5 11 A45 45 0 0 0 27.5 11 Z"/>
      <path d="M50 50 L88.5 72 A45 45 0 0 0 88.5 28 Z" transform="rotate(120 50 50)"/>
      <path d="M50 50 L88.5 72 A45 45 0 0 0 88.5 28 Z" transform="rotate(240 50 50)"/>
    </g>
  </svg>
  <h1>Font Radioactiva</h1>
  <p class="lead">Has creat una ruta cap a una <b>font radioactiva amagada</b> a prop teu. La pantalla quedarà negra: guia't <b>només per la velocitat dels clics</b>. Com més ràpid sonen, més a prop ets. Arriba-hi i desactiva l'alarma.</p>

  <div class="opts">
    <label class="row">Distància inicial
      <span class="control"><input type="range" id="dist" min="100" max="1000" step="50" value="500"><span class="v" id="distV">500 m</span></span>
    </label>
    <label class="row">Radi d'arribada
      <span class="control"><input type="range" id="goal" min="5" max="30" step="1" value="10"><span class="v" id="goalV">10 m</span></span>
    </label>
    <label class="check"><input type="checkbox" id="vib" checked> Vibració de proximitat</label>
  </div>

  <button id="startBtn">Comença la cerca</button>
  <div class="err" id="introErr"></div>
</div>

<!-- PANTALLA 2: JOC -->
<div class="screen" id="play">
  <button class="exit-btn" id="exitBtn">← Surt</button>
  <div class="hint">Escolta…</div>
  <div class="pulse-ring" id="pulseRing"></div>
</div>

<!-- PANTALLA 3: ALARMA -->
<div class="screen" id="alarm">
  <div class="alarm-title">⚠ Alarma nuclear ⚠</div>
  <div class="alarm-sub">Has trobat la font. Desactiva-la!</div>
  <button id="defuse">Desactiva</button>
</div>

<!-- PANTALLA 4: FINAL -->
<div class="screen" id="win">
  <div class="win-title">✓ Desactivada</div>
  <div class="stat" id="winTime"></div>
  <div class="stat" id="winDist"></div>
  <button id="again" style="margin-top:24px;">Torna a jugar</button>
</div>

<script>
/* ---------- Àudio (comptador Geiger + sirena) ---------- */
let ctx;
function ac(){
  if(!ctx) ctx=new (window.AudioContext||window.webkitAudioContext)();
  if(ctx.state==='suspended') ctx.resume();
  return ctx;
}

function clickSound(intensity=1){
  const a=ac(), t=a.currentTime, dur=0.03;
  const buf=a.createBuffer(1,Math.ceil(a.sampleRate*dur),a.sampleRate);
  const d=buf.getChannelData(0);
  for(let i=0;i<d.length;i++) d[i]=Math.random()*2-1;
  const src=a.createBufferSource(); src.buffer=buf;
  const bp=a.createBiquadFilter(); bp.type='bandpass'; bp.frequency.value=1800; bp.Q.value=8;
  const g=a.createGain();
  g.gain.setValueAtTime(0.0001,t);
  g.gain.exponentialRampToValueAtTime(0.9*intensity,t+0.0008);
  g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  src.connect(bp); bp.connect(g); g.connect(a.destination);
  src.start(t); src.stop(t+dur);
}

let siren=null;
function startSiren(){
  const a=ac();
  const osc=a.createOscillator(); osc.type='sawtooth';
  const lfo=a.createOscillator(); lfo.type='sine'; lfo.frequency.value=0.8;
  const lfoG=a.createGain(); lfoG.gain.value=260;
  osc.frequency.value=660;
  lfo.connect(lfoG); lfoG.connect(osc.frequency);
  const g=a.createGain(); g.gain.value=0.2;
  osc.connect(g); g.connect(a.destination);
  osc.start(); lfo.start();
  siren={osc,lfo};
}
function stopSiren(){ if(siren){ try{siren.osc.stop();siren.lfo.stop();}catch(e){} siren=null; } }

/* ---------- Geometria ---------- */
const R=6371000;
const toRad=d=>d*Math.PI/180;
const toDeg=r=>r*180/Math.PI;
function haversine(a,b,c,d){
  const dLat=toRad(c-a), dLon=toRad(d-b);
  const s=Math.sin(dLat/2)**2+Math.cos(toRad(a))*Math.cos(toRad(c))*Math.sin(dLon/2)**2;
  return 2*R*Math.asin(Math.sqrt(s));
}
function destPoint(lat,lon,bearing,dist){
  const br=toRad(bearing), dr=dist/R, l1=toRad(lat), o1=toRad(lon);
  const l2=Math.asin(Math.sin(l1)*Math.cos(dr)+Math.cos(l1)*Math.sin(dr)*Math.cos(br));
  const o2=o1+Math.atan2(Math.sin(br)*Math.sin(dr)*Math.cos(l1), Math.cos(dr)-Math.sin(l1)*Math.sin(l2));
  return [toDeg(l2),toDeg(o2)];
}

/* ---------- Estat del joc ---------- */
let target=null, initialDist=500, goalRadius=10, vibOn=true;
let watchId=null, geigerTimer=null, running=false, startTime=0, wakeLock=null;
let lastDist=500;
const minRate=0.6, maxRate=28; // clics/s lluny → a prop

/* ---------- Color de proximitat ----------
   Com més a prop de la font, el punt central passa de groc → taronja → vermell.
   Si l'usuari s'allunya més enllà de la distància inicial, vira cap a blanc. */
function mix(c1,c2,t){
  t=Math.min(Math.max(t,0),1);
  return [Math.round(c1[0]+(c2[0]-c1[0])*t),
          Math.round(c1[1]+(c2[1]-c1[1])*t),
          Math.round(c1[2]+(c2[2]-c1[2])*t)];
}
function proxColor(p){
  const white=[255,255,255], groc=[247,208,0], taronja=[255,140,0], vermell=[226,58,46];
  let c;
  if(p<=0)        c=mix(groc,white,-p);          // s'allunya → blanc
  else if(p<0.5)  c=mix(groc,taronja,p/0.5);     // s'aproxima → taronja
  else            c=mix(taronja,vermell,(p-0.5)/0.5); // a prop → vermell
  return 'rgb('+c[0]+','+c[1]+','+c[2]+')';
}

const $=id=>document.getElementById(id);
function show(id){ document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active')); $(id).classList.add('active'); }

/* ---- Recorda les opcions ---- */
const PREF='radioactiva-opts';
function loadOpts(){
  try{
    const o=JSON.parse(localStorage.getItem(PREF)||'null'); if(!o)return;
    if(o.dist)$('dist').value=o.dist;
    if(o.goal)$('goal').value=o.goal;
    if(typeof o.vib==='boolean')$('vib').checked=o.vib;
  }catch(_){}
}
function saveOpts(){
  try{localStorage.setItem(PREF,JSON.stringify({dist:$('dist').value,goal:$('goal').value,vib:$('vib').checked}));}catch(_){}
}

$('dist').oninput=()=>$('distV').textContent=$('dist').value+' m';
$('goal').oninput=()=>$('goalV').textContent=$('goal').value+' m';
loadOpts();
$('distV').textContent=$('dist').value+' m';
$('goalV').textContent=$('goal').value+' m';

/* ---- Manté la pantalla encesa durant la cerca ---- */
async function requestWake(){
  try{ if('wakeLock' in navigator){ wakeLock=await navigator.wakeLock.request('screen'); } }catch(_){}
}
function releaseWake(){ try{ wakeLock&&wakeLock.release(); }catch(_){} wakeLock=null; }
document.addEventListener('visibilitychange',()=>{ if(running&&document.visibilityState==='visible'&&!wakeLock) requestWake(); });

/* ---------- Inici ---------- */
$('startBtn').onclick=()=>{
  ac();
  initialDist=+$('dist').value; goalRadius=+$('goal').value;
  vibOn=$('vib').checked;
  lastDist=initialDist;
  saveOpts();
  $('introErr').textContent='';

  // ---- Mode GPS real ----
  if(!('geolocation' in navigator)){ $('introErr').textContent='Aquest dispositiu no permet geolocalització.'; return; }
  $('introErr').textContent='Obtenint la teva posició…';

  navigator.geolocation.getCurrentPosition(pos=>{
    const {latitude,longitude}=pos.coords;
    const bearing=Math.random()*360;
    target=destPoint(latitude,longitude,bearing,initialDist);
    startTime=Date.now();
    running=true;
    $('introErr').textContent='';
    show('play');
    requestWake();
    scheduleClick(currentRate(initialDist));
    watchId=navigator.geolocation.watchPosition(onMove,onGeoErr,{enableHighAccuracy:true,maximumAge:0,timeout:20000});
  }, err=>{
    $('introErr').textContent='No s\'ha pogut accedir a la ubicació ('+err.message+'). Cal donar permís de localització.';
  }, {enableHighAccuracy:true,timeout:20000});
};

function currentRate(dist){
  const prox=Math.min(Math.max(1-dist/initialDist,0),1);   // 0 lluny … 1 a prop
  return minRate*Math.pow(maxRate/minRate, prox);          // creixement geomètric
}

function onMove(pos){
  if(!running) return;
  const {latitude,longitude,accuracy}=pos.coords;
  const dist=haversine(latitude,longitude,target[0],target[1]);
  lastDist=dist;
  if(dist<=goalRadius) reachTarget();
}
function onGeoErr(err){}

const pulseRing=$('pulseRing');
const DOUBLE_GAP=0.065;   // separació (s) del clic dèbil "enganxat" al fort
const DOUBLE_PROB=0.3;    // probabilitat que un clic sigui doble (fort + dèbil)
let weakTimer=null;

/* Emet un "tic": so + pulsació del punt, sempre disparats al mateix instant
   perquè quedin perfectament sincronitzats. intensity 1 = fort, <1 = dèbil. */
function emitTick(intensity){
  if(!running) return;
  clickSound(intensity);
  const prox=1-lastDist/initialDist;   // 1 a prop, 0 a la distància inicial, <0 si s'allunya
  pulseRing.style.setProperty('--tick', proxColor(prox));
  pulseRing.style.setProperty('--tick-scale', (1+1.4*intensity).toFixed(2)); // fort més gran que dèbil
  pulseRing.style.setProperty('--tick-glow', Math.round(22*intensity)+'px');
  pulseRing.classList.remove('tick'); void pulseRing.offsetWidth; pulseRing.classList.add('tick');
  if(vibOn && navigator.vibrate && prox>0.45){
    navigator.vibrate(Math.round((8+prox*22)*intensity));
  }
}

function scheduleClick(rate){
  if(!running) return;
  emitTick(1);                                  // clic fort + pulsació forta
  // De tant en tant, un clic dèbil "enganxat" just després: el punt el segueix
  // amb una pulsació més dèbil, amb el mateix interval que el so.
  let extra=0;
  if(Math.random()<DOUBLE_PROB){
    weakTimer=setTimeout(()=>emitTick(0.4), DOUBLE_GAP*1000);
    extra=DOUBLE_GAP*1000+40;                    // evita que el següent clic trepitgi el dèbil
  }
  const delay=-Math.log(1-Math.random())/rate*1000; // intervals tipus Poisson
  geigerTimer=setTimeout(()=>scheduleClick(currentRate(lastDist)), Math.max(delay,extra));
}

function reachTarget(){
  running=false;
  clearTimeout(geigerTimer); clearTimeout(weakTimer);
  if(navigator.vibrate) navigator.vibrate([200,100,200,100,400]);
  show('alarm'); $('alarm').classList.add('flash');
  startSiren();
}

function cleanup(){
  running=false;
  clearTimeout(geigerTimer); clearTimeout(weakTimer);
  stopSiren();
  if(watchId!=null){ navigator.geolocation.clearWatch(watchId); watchId=null; }
  releaseWake();
}

$('exitBtn').onclick=()=>{
  cleanup();
  show('intro');
};

$('defuse').onclick=()=>{
  stopSiren();
  $('alarm').classList.remove('flash');
  if(watchId!=null){ navigator.geolocation.clearWatch(watchId); watchId=null; }
  releaseWake();
  if(navigator.vibrate) navigator.vibrate(60);
  const secs=Math.round((Date.now()-startTime)/1000);
  $('winTime').textContent='Temps: '+Math.floor(secs/60)+' min '+(secs%60)+' s';
  $('winDist').textContent='Recorregut inicial: ~'+initialDist+' m';
  show('win');
};

$('again').onclick=()=>{
  cleanup();
  $('introErr').textContent='';
  show('intro');
};
</script>
</body>
</html>
